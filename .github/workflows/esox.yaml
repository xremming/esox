name: "Esox"

on:
  push:

jobs:
  gofmt:
    name: "go fmt"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6
      - uses: "actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00" # v6
        with:
          go-version-file: "./go.mod"

      - run: "test -z $(gofmt -l .)"

  govet:
    name: "go vet"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6
      - uses: "actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00" # v6
        with:
          go-version-file: "./go.mod"

      - run: "go vet ./..."

  gotest:
    name: "go test"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6
      - uses: "actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00" # v6
        with:
          go-version-file: "./go.mod"

      - run: "go test ./..."
